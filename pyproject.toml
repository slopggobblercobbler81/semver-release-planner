[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semver-release-planner"
version = "1.0.0"
description = "Analyze git commits, calculate next SemVer version, and generate changelogs."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "slopggobblercobbler81" }
]
keywords = [
    "semver",
    "semantic-versioning",
    "release-planner",
    "git",
    "changelog",
    "conventional-commits",
    "release-automation"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Build Tools"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
semver-release-planner = "semver_release_planner.cli:main"

[project.urls]
Homepage = "https://github.com/slopggobblercobbler81/semver-release-planner"
Repository = "https://github.com/slopggobblercobbler81/semver-release-planner"
Issues = "https://github.com/slopggobblercobbler81/semver-release-planner/issues"

[tool.setuptools.packages.find]
where = ["src"]
