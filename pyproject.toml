[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semver-release-planner"
version = "0.1.0"
description = "Analyze git commits, calculate next SemVer version, and generate changelogs."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
semver-release-planner = "semver_release_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
